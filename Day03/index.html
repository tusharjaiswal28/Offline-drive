<!DOCTYPE html>
<html>
<head>
  <title>ShopQuest (Beginner)</title>
  <style>
    body { font-family: Arial; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
    .card { border: 1px solid #ccc; padding: 10px; }
    img { width: 100px; height: 100px; object-fit: contain; }
  </style>
</head>
<body>

<h1>🛒 ShopQuest (Beginner)</h1>


<div>
  <input id="username" placeholder="username" />
  <input id="password" placeholder="password" type="password" />
  <button onclick="login()">Login</button>
  <span id="user"></span>
</div>

<hr />

<input id="search" placeholder="Search products..." />

<h3>Products</h3>
<div id="products" class="grid"></div>

<h3>Cart</h3>
<div id="cart"></div>
<button onclick="checkout()">Checkout</button>

<script>
const API = "https://fakestoreapi.com";

let products = [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let token = localStorage.getItem("token");

function loadProducts() {
  fetch(API + "/products")
    .then(res => res.json())
    .then(data => {
      products = data;
      localStorage.setItem("cachedProducts", JSON.stringify(data));
      renderProducts(data);
    })
    .catch(() => {
      const cached = JSON.parse(localStorage.getItem("cachedProducts")) || [];
      alert("Offline: showing cached products");
      renderProducts(cached);
    });
}

function renderProducts(list) {
  const div = document.getElementById("products");
  div.innerHTML = "";

  list.forEach(item => {
    div.innerHTML += `
      <div class="card">
        <img src="${item.image}" />
        <h4>${item.title}</h4>
        <p>$${item.price}</p>
        <button onclick='addToCart(${JSON.stringify(item)})'>Add</button>
      </div>
    `;
  });
}

document.getElementById("search").addEventListener("input", e => {
  const term = e.target.value.toLowerCase();
  const filtered = products.filter(p =>
    p.title.toLowerCase().includes(term)
  );
  renderProducts(filtered);
});


function login() {
  fetch(API + "/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: username.value,
      password: password.value
    })
  })
  .then(res => res.json())
  .then(data => {
    token = data.token;
    localStorage.setItem("token", token);
    document.getElementById("user").innerText = "Logged In";
    alert("Login Successful");
  })
  .catch(() => alert("Login Failed"));
}


loadProducts();

</script>

</body>
</html>
